<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Workspace â€” Aibii</title>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
          colors: { brand: { primary: '#5B63F6' } },
        },
      },
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .nav-item { transition: background-color 100ms ease; cursor: pointer; }
    .nav-item:hover { background-color: #EEF2FF; }
    .ws-submenu { display: none; }
    .ws-submenu.open { display: block; }
    .ws-chevron { transition: transform 150ms ease; }
    .ws-item.open .ws-chevron { transform: rotate(90deg); }

    /* â”€â”€ Wizard Modal â”€â”€ */
    #wizard-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(17, 24, 39, 0.45);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #wizard-modal {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.18), 0 4px 16px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalIn 220ms cubic-bezier(0.34,1.56,0.64,1) forwards;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.94) translateY(10px); }
      to   { opacity: 1; transform: scale(1)    translateY(0); }
    }

    /* Step panels */
    .step-panel { display: none; flex-direction: column; }
    .step-panel.active {
      display: flex;
      animation: slideIn 200ms ease forwards;
    }
    .step-panel.back-active {
      display: flex;
      animation: slideInBack 200ms ease forwards;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(18px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInBack {
      from { opacity: 0; transform: translateX(-18px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Step dots */
    .sdot {
      height: 8px;
      border-radius: 9999px;
      transition: all 240ms cubic-bezier(0.34,1.2,0.64,1);
      background: #D1D5DB;
      width: 8px;
    }
    .sdot.done    { background: #C7D2FE; width: 8px; }
    .sdot.active  { background: #5B63F6; width: 24px; }

    /* Plan cards */
    .plan-card {
      border: 2px solid #E5E7EB;
      border-radius: 12px;
      padding: 14px 12px;
      cursor: pointer;
      transition: border-color 180ms, box-shadow 180ms, background 180ms;
      position: relative;
    }
    .plan-card:hover:not(.selected) { border-color: #A5B4FC; }
    .plan-card.selected {
      border-color: #5B63F6;
      background: #F5F6FF;
      box-shadow: 0 0 0 4px rgba(91,99,246,0.10);
    }
    .plan-badge {
      position: absolute;
      top: -10px; left: 50%;
      transform: translateX(-50%);
      background: #5B63F6;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 9999px;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    /* Member row */
    .member-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid #F1F2F9;
      background: #FAFAFF;
    }
    .member-row:hover .remove-btn { opacity: 1; }
    .remove-btn {
      opacity: 0;
      transition: opacity 140ms;
    }

    /* Suggestion dropdown */
    #member-suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.11);
      z-index: 100;
      overflow: hidden;
      max-height: 200px;
      overflow-y: auto;
    }
    .sug-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      cursor: pointer;
      transition: background 100ms;
    }
    .sug-item:hover { background: #F5F6FF; }

    /* Role select custom arrow */
    .role-select {
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%239CA3AF' stroke-width='2'><path stroke-linecap='round' stroke-linejoin='round' d='M19 9l-7 7-7-7'/></svg>");
      background-repeat: no-repeat;
      background-position: right 7px center;
      background-size: 11px;
      padding-right: 24px;
    }

    /* Primary button */
    .btn-primary {
      background: #5B63F6;
      color: #fff;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      height: 36px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(91,99,246,0.28);
      transition: background 150ms, box-shadow 150ms;
      border: none;
      cursor: pointer;
    }
    .btn-primary:hover:not(:disabled) { background: #4850e4; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

    /* Ghost button */
    .btn-ghost {
      background: #fff;
      color: #6B7280;
      border: 1px solid #E5E7EB;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      height: 36px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 120ms;
      cursor: pointer;
    }
    .btn-ghost:hover { background: #F9FAFB; }
  </style>
</head>
<body class="font-sans bg-gray-50 text-gray-900 flex h-screen overflow-hidden">

  <!-- NEW WORKSPACE FULLSCREEN MODAL (this is the page) -->
  <div id="new-ws-modal" class="fixed inset-0 z-[60] flex flex-col" style="background:#F3F4F6">
    <!-- Topbar -->
    <div class="flex items-center justify-between px-6 h-11 bg-white border-b border-gray-100 flex-shrink-0">
      <div class="flex items-center gap-2">
        <span class="w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-bold" style="background:#5B63F6">A</span>
        <span class="text-[13px] font-semibold text-gray-800">Aibii</span>
      </div>
      <a href="../recent-view/index.html" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </a>
    </div>
    <!-- Body -->
    <div class="flex-1 flex items-center justify-center overflow-y-auto py-8">
      <div class="bg-white rounded-lg w-full max-w-lg mx-4 px-7 py-8" style="box-shadow:0 1px 4px rgba(0,0,0,0.07)">
        <!-- Header -->
        <div class="mb-6">
          <h2 class="text-[17px] font-bold text-gray-900">New workspace</h2>
          <p class="text-[12px] text-gray-400 mt-1">A shared space for your team's work.</p>
        </div>
        <!-- Avatar + name row -->
        <div class="flex items-center gap-3 mb-5">
          <div id="ws-preview-avatar"
            class="w-11 h-11 rounded-xl flex items-center justify-center text-white text-base font-bold flex-shrink-0 cursor-pointer select-none transition-all"
            style="background:#5B63F6"
            onclick="cycleWsColor()" title="Click to change color">A
          </div>
          <div class="flex-1 min-w-0">
            <p id="ws-preview-name" class="text-[13px] font-semibold text-gray-800 truncate">Your workspace</p>
            <p class="text-[11px] text-gray-400">Click avatar to change color</p>
          </div>
        </div>
        <!-- Fields -->
        <div class="space-y-3">
          <div>
            <label class="block text-[12px] font-medium text-gray-600 mb-1">Name <span class="text-red-400">*</span></label>
            <input id="new-ws-name" type="text" placeholder="e.g. Design Team" autocomplete="off" maxlength="48"
              class="w-full h-9 px-3 text-[13px] text-gray-900 bg-gray-50 border border-gray-200 rounded-lg outline-none transition placeholder-gray-400"
              oninput="onWsNameInput(this.value)"
              onfocus="this.style.borderColor='#5B63F6';this.style.background='#fff';this.style.boxShadow='0 0 0 3px rgba(91,99,246,0.10)'"
              onblur="this.style.borderColor='';this.style.background='';this.style.boxShadow=''"
              onkeydown="if(event.key==='Enter')createNewWs()">
          </div>
          <div>
            <label class="block text-[12px] font-medium text-gray-600 mb-1">Description <span class="text-gray-400 font-normal">optional</span></label>
            <textarea id="new-ws-desc" rows="2" placeholder="What is this workspace for?"
              class="w-full px-3 py-2 text-[13px] text-gray-900 bg-gray-50 border border-gray-200 rounded-lg outline-none transition resize-none placeholder-gray-400"
              onfocus="this.style.borderColor='#5B63F6';this.style.background='#fff';this.style.boxShadow='0 0 0 3px rgba(91,99,246,0.10)'"
              onblur="this.style.borderColor='';this.style.background='';this.style.boxShadow=''"></textarea>
          </div>
        </div>
        <!-- Actions -->
        <div class="flex gap-2 mt-5">
          <a href="../recent-view/index.html" class="flex-1 h-9 rounded-lg text-[13px] font-medium text-gray-600 border border-gray-200 hover:bg-gray-50 transition-colors flex items-center justify-center">Cancel</a>
          <button onclick="createNewWs()" class="flex-1 h-9 rounded-lg text-[13px] font-semibold text-white transition-colors" style="background:#5B63F6" onmouseover="this.style.background='#4850e4'" onmouseout="this.style.background='#5B63F6'">Create</button>
        </div>
      </div>
    </div>
  </div>

  

  <!-- â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
       WORKSPACE SWITCHER MODAL
  â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• -->
  <div id="ws-modal" onclick="if(event.target===this)closeWsModal()"
       style="display:none;position:fixed;inset:0;z-index:70;background:rgba(17,24,39,0.4);backdrop-filter:blur(2px);align-items:center;justify-content:center;">
    <div class="bg-white rounded-2xl shadow-2xl w-[480px] max-w-[92vw] overflow-hidden" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-6 pt-5 pb-4 border-b border-gray-100">
        <h2 class="text-[16px] font-bold text-gray-900">Switch workspace</h2>
        <div class="flex items-center gap-2">

          <button onclick="closeWsModal()" class="flex items-center gap-1.5 px-3 h-8 rounded-lg text-[12px] font-semibold text-[#5B63F6] bg-[#EEF2FF] hover:bg-[#E0E7FF] transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
            New workspace
          </button>
          <button onclick="closeWsModal()" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div class="px-4 py-3 space-y-1" id="ws-modal-list"></div>
    </div>
  </div>

  <!-- â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
       JAVASCRIPT
  â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• -->
  <script>
    // â”€â”€ State â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    // ── New workspace form ──────────────────────────────────
    var wsColors = ['#5B63F6','#16A34A','#F97316','#8B5CF6','#EC4899','#0EA5E9','#EAB308'];
    var wsNewColor = '#5B63F6';
    var wsColorIndex = 0;

    function cycleWsColor() {
      wsColorIndex = (wsColorIndex + 1) % wsColors.length;
      wsNewColor = wsColors[wsColorIndex];
      var el = document.getElementById('ws-preview-avatar');
      if (el) { el.style.background = wsNewColor; }
    }

    function onWsNameInput(val) {
      var preview = document.getElementById('ws-preview-name');
      var avatarEl = document.getElementById('ws-preview-avatar');
      if (preview) preview.textContent = val.trim() || 'Your workspace';
      if (avatarEl) avatarEl.textContent = val.trim() ? val.trim()[0].toUpperCase() : 'A';
    }

    function createNewWs() {
      var name = document.getElementById('new-ws-name').value.trim();
      if (!name) { document.getElementById('new-ws-name').focus(); return; }
      var saved = [];
      try { saved = JSON.parse(localStorage.getItem('aibii_workspaces')||'[]'); } catch(e){}
      saved.push({ id:'ws-'+Date.now(), name:name, desc:document.getElementById('new-ws-desc').value.trim(), initial:name[0].toUpperCase(), color:wsNewColor, createdAt:Date.now() });
      localStorage.setItem('aibii_workspaces', JSON.stringify(saved));
      window.location.href = '../recent-view/index.html';
    }

    // ── Workspace switcher modal ─────────────────────────────
    var wsData = [

      { id:'ws-manish', name:"Manish kumar's Workspace", initial:'M', color:'#3B5BDB', current:true  },
      { id:'ws-scg',    name:'Sovereign Capital Gate',   initial:'S', color:'#5B63F6', current:false },
    ];

    function renderWsModalList() {
      document.getElementById('ws-modal-list').innerHTML = wsData.map(function(ws) {
        return '<button onclick="selectWorkspace(\'' + ws.id + '\')" style="width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:none;cursor:pointer;text-align:left;background:' + (ws.current?'#EEF2FF':'transparent') + ';transition:background 100ms" onmouseover="if(!'+ws.current+')this.style.background=\'#F9FAFB\'" onmouseout="this.style.background=\'' + (ws.current?'#EEF2FF':'transparent') + '\'">'
          + '<span style="width:36px;height:36px;border-radius:9px;background:'+ws.color+';display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;flex-shrink:0">'+ws.initial+'</span>'
          + '<span style="flex:1;min-width:0"><p style="font-size:13px;font-weight:600;color:#111827">' + ws.name + '</p><p style="font-size:11px;color:#9CA3AF">' + (ws.current?'Current workspace':'Switch to this') + '</p></span>'
          + (ws.current ? '<svg style="width:16px;height:16px;color:#5B63F6;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>' : '')
          + '</button>';
      }).join('');
    }

    function openWsModal()  { renderWsModalList(); document.getElementById('ws-modal').style.display = 'flex'; }
    function closeWsModal() { document.getElementById('ws-modal').style.display = 'none'; }

    function selectWorkspace(id) {
      wsData.forEach(function(ws){ ws.current = ws.id===id; });
      var ws = wsData.find(function(w){ return w.id===id; });
      if (ws) {
        var wrap = document.getElementById('ws-switcher-wrapper');
        var nameEl   = wrap && wrap.querySelector('.truncate');
        var avatarEl = wrap && wrap.querySelector('.rounded-full');
        if (nameEl)   nameEl.textContent = ws.name.length>22 ? ws.name.slice(0,22)+'â€¦' : ws.name;
        if (avatarEl) { avatarEl.textContent = ws.initial; avatarEl.style.background = ws.color; }
      }
      closeWsModal();
    }
  </script>
</body>
</html>
